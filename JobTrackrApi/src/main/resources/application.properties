spring.application.name=jobtrackr_api

server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.host-header=X-Forwarded-Host
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# SQL/Hibernate 
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true

spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

jwt.signing-key=${JWT_SIGNING_KEY}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:refresh_token}
jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:false}
jwt.refresh-cookie-allow-insecure=${JWT_REFRESH_COOKIE_ALLOW_INSECURE:false}
jwt.refresh-cookie-same-site=${JWT_REFRESH_COOKIE_SAME_SITE:Lax}

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.size-parameter=size
spring.data.web.pageable.max-page-size=100

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

jobtrackr.r2.endpoint=${R2_ENDPOINT:}
jobtrackr.r2.access-key-id=${R2_ACCESS_KEY_ID:}
jobtrackr.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
jobtrackr.r2.bucket=${R2_BUCKET:}
jobtrackr.r2.signed-url-seconds=${R2_SIGNED_URL_SECONDS:60}

jobtrackr.cv-generation.service-base-url=${CV_GENERATION_SERVICE_BASE_URL:http://localhost:8081}
jobtrackr.cv-generation.service-token=${CV_GENERATION_SERVICE_TOKEN:dev-service-token}
jobtrackr.cv-generation.request-timeout=${CV_GENERATION_REQUEST_TIMEOUT:5m}
jobtrackr.cv-generation.worker-concurrency=${CV_GENERATION_WORKER_CONCURRENCY:1}
jobtrackr.cv-generation.worker-poll-ms=${CV_GENERATION_WORKER_POLL_MS:2000}
jobtrackr.cv-generation.cleanup-poll-ms=${CV_GENERATION_CLEANUP_POLL_MS:5000}
jobtrackr.cv-generation.lease-duration=${CV_GENERATION_LEASE_DURATION:15m}
jobtrackr.cv-generation.max-attempts=${CV_GENERATION_MAX_ATTEMPTS:3}
jobtrackr.cv-generation.max-cleanup-attempts=${CV_GENERATION_MAX_CLEANUP_ATTEMPTS:10}
jobtrackr.cv-generation.max-application-cvs=${CV_GENERATION_MAX_APPLICATION_CVS:20}
jobtrackr.cv-generation.max-job-description-chars=${CV_GENERATION_MAX_JOB_DESCRIPTION_CHARS:50000}
jobtrackr.cv-generation.max-additional-info-chars=${CV_GENERATION_MAX_ADDITIONAL_INFO_CHARS:5000}
jobtrackr.cv-generation.consent-version=${CV_GENERATION_CONSENT_VERSION:v1}
jobtrackr.cv-generation.purge-failed-after-days=${CV_GENERATION_PURGE_FAILED_AFTER_DAYS:15}
jobtrackr.cv-generation.purge-cron=${CV_GENERATION_PURGE_CRON:0 15 3 * * *}

jobtrackr.auth.rate-limit.cache-maximum-size=${AUTH_RATE_LIMIT_CACHE_MAXIMUM_SIZE:100000}
jobtrackr.auth.rate-limit.cache-expire-after=${AUTH_RATE_LIMIT_CACHE_EXPIRE_AFTER:2h}

jobtrackr.google.enabled=${GOOGLE_AUTH_ENABLED:false}
jobtrackr.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
jobtrackr.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
jobtrackr.google.public-origin=${JOBTRACKR_PUBLIC_ORIGIN:}
jobtrackr.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:}
jobtrackr.google.issuer-uri=${GOOGLE_OAUTH_ISSUER_URI:https://accounts.google.com}
jobtrackr.google.authorization-uri=${GOOGLE_OAUTH_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
jobtrackr.google.token-uri=${GOOGLE_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}
jobtrackr.google.jwk-set-uri=${GOOGLE_OAUTH_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}

server.servlet.session.cookie.name=JOBTRACKR_OAUTH_SESSION
server.servlet.session.cookie.path=/api/v1
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=5m
server.servlet.session.cookie.secure=${JWT_REFRESH_COOKIE_SECURE:false}

# Access logs stay off. The pattern omits query strings so enabling them later
# cannot retain OAuth authorization codes or provider errors.
server.tomcat.accesslog.enabled=false
server.tomcat.accesslog.pattern=%h %l %u %t "%m %U %H" %s %b

jobtrackr.gotenberg.base-url=${GOTENBERG_BASE_URL:http://localhost:3000}
jobtrackr.gotenberg.request-timeout=${GOTENBERG_REQUEST_TIMEOUT:35s}
jobtrackr.gotenberg.max-response-bytes=${GOTENBERG_MAX_RESPONSE_BYTES:15728640}
