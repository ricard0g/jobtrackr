user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Spring max request size is 11MB; leave a little headroom for multipart wrappers.
    client_max_body_size 12m;

    map $http_x_forwarded_proto $pass_forwarded_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }

    map $http_x_forwarded_host $pass_forwarded_host {
        ""      $host;
        default $http_x_forwarded_host;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/v1 {
            set $backend http://backend:8080;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $pass_forwarded_proto;
            proxy_set_header X-Forwarded-Host $pass_forwarded_host;
            proxy_set_header Connection "";
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
