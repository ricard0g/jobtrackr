# Host-managed system Nginx for the JobTrackr VPS tunnel phase.
# Copy to /etc/nginx/sites-available/jobtrackr and enable that site yourself.
# This file is not owned by Compose, systemd, or any repository script.
#
# Listen on a loopback origin that is NOT the Docker frontend mapping.
# 18081 is an arbitrary host-Nginx port. 18080 is an arbitrary JOBTRACKR_PORT.
# Change proxy_pass if JOBTRACKR_PORT is not 18080. Do not also listen on 18080.
# Do not listen on 80 or 443 while public ports stay closed for the tunnel.

server {
    listen 127.0.0.1:18081;
    server_name jobtrackr.example.test;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The cloudflared hop to this listener is HTTP. Public clients use HTTPS.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }
}
