services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobtrackr}
      POSTGRES_USER: ${POSTGRES_USER:-jobtrackr_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobtrackr_app}
    volumes:
      - jobtrackr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-jobtrackr_app} -d ${POSTGRES_DB:-jobtrackr}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  cv-generation:
    build:
      context: ./cv-generation-service
    image: ${JOBTRACKR_CV_GENERATION_IMAGE:-jobtrackr-cv-generation:local}
    ports:
      - "127.0.0.1:${CV_GENERATION_PORT:-8081}:8081"
    environment:
      CV_GENERATION_SERVICE_TOKEN: ${CV_GENERATION_SERVICE_TOKEN:-dev-service-token}
      CV_GENERATION_PROVIDER: ${CV_GENERATION_PROVIDER:-gemini}
      CV_GENERATION_ALLOW_FAKE_PROVIDER: ${CV_GENERATION_ALLOW_FAKE_PROVIDER:-false}
      CV_GENERATION_PROFILE: ${CV_GENERATION_PROFILE:-local}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CV_GENERATION_MODEL_ID: ${CV_GENERATION_MODEL_ID:-gemini-3.1-flash-lite}
      CV_GENERATION_WORKFLOW_VERSION: ${CV_GENERATION_WORKFLOW_VERSION:-cv-graph-v2}
      CV_GENERATION_REQUEST_TIMEOUT_SECONDS: ${CV_GENERATION_REQUEST_TIMEOUT_SECONDS:-300}
      HOST: 0.0.0.0
      PORT: 8081
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/ready')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gotenberg:
    image: gotenberg/gotenberg:8.34.0-libreoffice
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-3000}:3000"
    environment:
      API_TIMEOUT: ${GOTENBERG_API_TIMEOUT:-30s}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://127.0.0.1:3000/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["full"]
    build:
      context: ./JobTrackrApi
    image: ${JOBTRACKR_BACKEND_IMAGE:-jobtrackr-backend:local}
    depends_on:
      postgres:
        condition: service_healthy
      cv-generation:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      SERVER_PORT: 8080
      DB_HOST: postgres:5432
      DB_NAME: ${POSTGRES_DB:-jobtrackr}
      DB_USERNAME: ${POSTGRES_USER:-jobtrackr_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME:-refresh_token}
      JWT_REFRESH_COOKIE_SECURE: ${JWT_REFRESH_COOKIE_SECURE:-true}
      JWT_REFRESH_COOKIE_ALLOW_INSECURE: ${JWT_REFRESH_COOKIE_ALLOW_INSECURE:-false}
      JWT_REFRESH_COOKIE_SAME_SITE: ${JWT_REFRESH_COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_SIGNED_URL_SECONDS: ${R2_SIGNED_URL_SECONDS:-60}
      CV_GENERATION_SERVICE_BASE_URL: http://cv-generation:8081
      CV_GENERATION_SERVICE_TOKEN: ${CV_GENERATION_SERVICE_TOKEN:-}
      CV_GENERATION_WORKER_CONCURRENCY: ${CV_GENERATION_WORKER_CONCURRENCY:-1}
      CV_GENERATION_REQUEST_TIMEOUT: ${CV_GENERATION_REQUEST_TIMEOUT:-5m}
      GOTENBERG_BASE_URL: http://gotenberg:3000
      GOTENBERG_REQUEST_TIMEOUT: ${GOTENBERG_REQUEST_TIMEOUT:-35s}
      GOTENBERG_MAX_RESPONSE_BYTES: ${GOTENBERG_MAX_RESPONSE_BYTES:-15728640}
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:8080/actuator/health/readiness",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    profiles: ["full"]
    build:
      context: ./jobtrackr-web
    image: ${JOBTRACKR_FRONTEND_IMAGE:-jobtrackr-frontend:local}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${JOBTRACKR_PUBLISH_HOST:-127.0.0.1}:${JOBTRACKR_PORT:-18080}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  jobtrackr_pgdata:
